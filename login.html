<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MakeMyCareer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-page-wrapper">
    <div class="form-container">

      <div class="form-brand">Make<span>My</span>Career</div>
      <h2>Welcome back</h2>
      <p class="form-subtitle">Sign in to continue your career journey</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn">Sign In →</button>
      </form>

      <div class="form-divider">or</div>

      <p class="form-footer-text">
        Don't have an account? <a href="register.html">Create one free</a>
      </p>

      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
  </div>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<!-- Your JS -->
<script src="script.js"></script>
</body>
</html>
