<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — MakeMyCareer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-page-wrapper">
    <div class="form-container">

      <div class="form-brand">Make<span>My</span>Career</div>
      <h2>Create Account</h2>
      <p class="form-subtitle">Join thousands discovering their ideal career path</p>

      <form id="registerForm" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" required>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Age</label>
            <input type="number" id="age" required>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Stream</label>
            <select id="stream" required>
              <option>Science</option>
              <option>Commerce</option>
              <option>Arts</option>
            </select>
          </div>
          <div class="form-group">
            <label>Education</label>
            <select id="education" required>
              <option>10th</option>
              <option>12th</option>
              <option>Graduate</option>
            </select>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="password" required>
            <button type="button" id="togglePw1">👁️</button>
          </div>
          <div class="strength-bar"><div id="strengthFill"></div></div>
          <div id="strengthLabel"></div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" required>
            <button type="button" id="togglePw2">👁️</button>
          </div>
          <div id="matchMsg"></div>
        </div>

        <button type="submit">Create Account</button>
      </form>

    </div>
  </div>

   <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>


  <script src="script.js"></script>
</body>
</html>
